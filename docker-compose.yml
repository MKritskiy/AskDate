version: '3.8'
services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - users.web
      - askdate.web

  users.web:
    image: ${DOCKER_REGISTRY-}usersweb
    build:
      context: .
      dockerfile: User.API/User.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ConnectionString=Host=users.db;Port=5432;Database=UserDB;Username=postgres;Password=${DB_PASSWORD:-postgres}
      - Jwt__Key=${JWT_KEY:-YourExtremelySecretKey12345!@#$}
      - Jwt__Issuer=${JWT_ISSUER:-AskDateIssuer}
      - Jwt__Audience=${JWT_AUDIENCE:-AskDateAudience}
    depends_on:
      - users.db
    ports:
      - "50002:8080"

  users.db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: UserDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - users_db_data:/var/lib/postgresql/data

  askdate.web:
    image: ${DOCKER_REGISTRY-}askdateweb
    build:
      context: .
      dockerfile: Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__ConnectionString=Host=askdate.db;Port=5432;Database=AskDateDB;Username=postgres;Password=${DB_PASSWORD:-postgres}
      - Jwt__Key=${JWT_KEY:-YourExtremelySecretKey12345!@#$}
      - Jwt__Issuer=${JWT_ISSUER:-AskDateIssuer}
      - Jwt__Audience=${JWT_AUDIENCE:-AskDateAudience}
    depends_on:
      - askdate.db
    ports:
      - "5146:8080"
    volumes:
      - ./Web/wwwroot:/app/wwwroot:ro

  askdate.db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: AskDateDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - askdate_db_data:/var/lib/postgresql/data

volumes:
  users_db_data:
  askdate_db_data: